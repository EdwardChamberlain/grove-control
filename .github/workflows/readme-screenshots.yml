name: Refresh README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-readme-screenshots
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and open screenshot PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the dev branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/dev" ]]; then
            echo "::error::Run this workflow with the dev branch selected."
            exit 1
          fi

      - name: Check out dev
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate README screenshots
        working-directory: frontend
        run: npm run generate:readme-screenshots

      - name: Verify generated change scope
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r status_line; do
            path="${status_line:3}"
            case "$path" in
              docs/screenshots/kiosk-mode.png|docs/screenshots/print-modal.png|docs/screenshots/printer-health.png|docs/screenshots/printers-cockpit.png|docs/screenshots/printers-list.png)
                ;;
              *)
                echo "::error file=$path::Screenshot generation changed an unexpected file."
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)
          exit "$unexpected"

      - name: Open or update screenshot PR
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/readme-screenshots
          PR_TITLE: 'docs: refresh README screenshots'
          PR_BODY: |
            Automated README screenshot refresh generated from the latest dev UI.

            This PR contains only the generated files under `docs/screenshots/`.
            Review the images before merging into `dev`.

            This PR was created by the `Refresh README screenshots` workflow.
        shell: bash
        run: |
          screenshots=(
            docs/screenshots/kiosk-mode.png
            docs/screenshots/print-modal.png
            docs/screenshots/printer-health.png
            docs/screenshots/printers-cockpit.png
            docs/screenshots/printers-list.png
          )

          if [[ -z "$(git status --porcelain -- "${screenshots[@]}")" ]]; then
            echo "README screenshots are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$AUTOMATION_BRANCH"
          git add -- "${screenshots[@]}"
          git commit -m "docs: refresh README screenshots"
          git push --force-with-lease origin "HEAD:$AUTOMATION_BRANCH"

          pr_number="$(gh pr list \
            --base dev \
            --head "$AUTOMATION_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body "$PR_BODY"
            gh pr view "$pr_number" --json url --jq .url
          else
            gh pr create \
              --base dev \
              --head "$AUTOMATION_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
