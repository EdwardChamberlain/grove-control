name: Docker Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/edwardchamberlain/grove-control

concurrency:
  group: docker-publish-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish :latest and version tag
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain an X.Y.Z version; got: $version" >&2
            exit 1
          fi
          revision="$(git rev-parse HEAD)"
          if [[ "$revision" != "$DEPLOYED_SHA" ]]; then
            echo "Checked out $revision, but CI validated $DEPLOYED_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production tags
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/EdwardChamberlain/grove-control
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=docker-publish-production
          cache-to: type=gha,scope=docker-publish-production,mode=max

      - name: Write deployed release metadata
        env:
          DEPLOYED_SHA: ${{ steps.version.outputs.revision }}
          DEPLOYED_VERSION: ${{ steps.version.outputs.version }}
          DEPLOYED_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const metadata = {
            commit: process.env.DEPLOYED_SHA,
            version: process.env.DEPLOYED_VERSION,
            source_branch: process.env.DEPLOYED_SOURCE_BRANCH,
          };
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/stable-release.json`,
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - name: Upload deployed release metadata
        uses: actions/upload-artifact@v7
        with:
          name: stable-release-metadata
          path: ${{ runner.temp }}/stable-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
