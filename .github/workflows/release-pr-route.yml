name: Release PR Route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  release-pr-route:
    name: Release PR Route
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev-to-main release route
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "::error::Release PRs must target main; got '$BASE_BRANCH'."
            exit 1
          fi

          if [[ "$HEAD_BRANCH" != "dev" ]]; then
            echo "::error::Release PRs must come from the dev branch; got '$HEAD_BRANCH'."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Release PRs must come from the repository's own dev branch; got '$HEAD_REPOSITORY'."
            exit 1
          fi

          echo "Release route accepted: $HEAD_REPOSITORY:$HEAD_BRANCH -> $REPOSITORY:$BASE_BRANCH"

  release-version:
    name: Release Version
    needs: release-pr-route
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Read base version
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_version="$(git show "${BASE_SHA}:VERSION")"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"

      - name: Check release version
        env:
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
        run: python scripts/check_version.py --previous-version "$BASE_VERSION"
