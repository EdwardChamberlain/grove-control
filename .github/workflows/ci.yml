name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  DIFF_COVER_VERSION: '10.6.0'

concurrency:
  # Superseded PR runs are cancelled. Pushes get a group per commit and are
  # never cancelled, so every commit on dev/main gets a CI result (a shared
  # group would still drop all but the newest pending run).
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-workflow-tests:
    name: Release Workflow Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test release workflow behavior without GitHub writes
        run: node --test .github/scripts/create_github_release.test.js

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/*.yml

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check version metadata
        run: python scripts/check_version.py

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  backend-tests:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        timeout-minutes: 10
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --tb=short \
            --timeout=60 --timeout-method=thread \
            -n auto \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration

  backend-coverage-shards:
    name: Backend Coverage (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Collect backend coverage
        # Greenlet-aware tracing is slower than the default tracer, so the
        # suite is sharded. The floor is enforced on the combined data in
        # the Backend Coverage job below.
        timeout-minutes: 25
        working-directory: backend
        env:
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.dat
        run: |
          python -m pytest tests/ \
            --tb=short \
            --timeout=60 --timeout-method=thread \
            -n auto \
            --splits 6 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --cov=app \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: backend/coverage-shard-${{ matrix.shard }}.dat
          retention-days: 1

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    needs: backend-coverage-shards
    # Run even when a shard failed so this required check fails instead of
    # being skipped (a skipped required check counts as passing).
    if: ${{ !cancelled() }}
    steps:
      - name: Fail if any coverage shard failed
        if: ${{ needs.backend-coverage-shards.result != 'success' }}
        run: |
          echo "Coverage shards: ${{ needs.backend-coverage-shards.result }}"
          exit 1

      - uses: actions/checkout@v6
        with:
          # The changed-lines report diffs against the base branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage greenlet diff-cover==${{ env.DIFF_COVER_VERSION }}

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: backend
          merge-multiple: true

      - name: Combine and enforce backend coverage
        working-directory: backend
        run: |
          coverage combine coverage-shard-*.dat
          # Raise this floor in the same PR as the tests that lift coverage
          # (CLAUDE.md, "Coverage floors").
          coverage report \
            --skip-covered \
            --show-missing \
            --fail-under=80.0

      - name: Report coverage of changed lines
        # Report only for now: shows how much of the PR's new and changed
        # code is tested without failing the build (issue #256).
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: backend
        run: |
          coverage xml -o coverage.xml
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --format markdown:diff-cover.md
          { echo "## Backend: coverage of changed lines"; cat diff-cover.md; } >> "$GITHUB_STEP_SUMMARY"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test-shards:
    name: Frontend Test Shards (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest shard
        # Each shard sees a third of the code, so the coverage floors are
        # enforced on the merged reports in the Frontend Tests job instead.
        timeout-minutes: 10
        working-directory: frontend
        run: |
          npx vitest run \
            --shard=${{ matrix.shard }}/3 \
            --reporter=blob \
            --outputFile=vitest-blobs/blob-${{ matrix.shard }}.json \
            --coverage \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.lines=0

      - name: Upload Vitest report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/vitest-blobs/
          retention-days: 1

  frontend-browser-tests:
    name: Frontend Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for browser tests
        working-directory: frontend
        run: |
          # Playwright installs its own Chromium. A stale Google Chrome APT
          # index on the hosted runner can otherwise fail this setup step
          # before the browser tests get a chance to run.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome-stable/deb' "$source"; then
              sudo rm -f "$source"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run browser tests
        timeout-minutes: 5
        working-directory: frontend
        run: npm run test:browser

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-test-shards, frontend-browser-tests]
    # Run even when an input failed so this required check fails instead of
    # being skipped (a skipped required check counts as passing).
    if: ${{ !cancelled() }}
    steps:
      - name: Fail if a test shard or the browser tests failed
        if: ${{ needs.frontend-test-shards.result != 'success' || needs.frontend-browser-tests.result != 'success' }}
        run: |
          echo "Vitest shards: ${{ needs.frontend-test-shards.result }}"
          echo "Browser tests: ${{ needs.frontend-browser-tests.result }}"
          exit 1

      - uses: actions/checkout@v6
        with:
          # The changed-lines report diffs against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download Vitest reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: frontend/vitest-blobs
          merge-multiple: true

      - name: Merge reports and enforce coverage floors
        working-directory: frontend
        run: npx vitest --merge-reports=vitest-blobs --coverage

      - name: Report coverage of changed lines
        # Report only for now: shows how much of the PR's new and changed
        # code is tested without failing the build (issue #256).
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: frontend
        run: |
          pipx run diff-cover==${{ env.DIFF_COVER_VERSION }} coverage/lcov.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --format markdown:diff-cover.md
          { echo "## Frontend: coverage of changed lines"; cat diff-cover.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check translation parity
        working-directory: frontend
        run: npm run check:i18n

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t grove-control:test .

      - name: Verify backend imports
        run: docker run --rm grove-control:test python -c "import backend.app.main; print('Backend imports OK')"

      - name: Verify static files exist
        run: docker run --rm grove-control:test test -d /app/static

      - name: Start container
        run: docker run -d --name grove-control-ci -e TESTING=1 -p 8000:8000 grove-control:test

      - name: Verify health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs grove-control-ci
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f grove-control-ci || true
